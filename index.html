<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa dos Mercadores - W.A.R</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Pirata+One&family=Rye&display=swap" rel="stylesheet">
    <style>
        .font-medieval { font-family: 'Cinzel', serif; }
        .font-handwriting { font-family: 'Cormorant Garamond', serif; }
        .font-wanted { font-family: 'Rye', cursive; }
        .font-pirata { font-family: 'Pirata One', cursive; }
        
        body {
            background-color: #0c0a09;
            color: #e7e5e4;
            font-family: 'Cinzel', serif;
            background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
        }

        .paper-texture {
            background-color: #f4e3c5;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
        }
        
        .wood-texture {
            background-color: #2c1e16;
            background-image: repeating-linear-gradient(to right, #2c1e16 0px, #3a271d 10px, #2c1e16 20px);
        }

        .sepia-filter {
            filter: sepia(0.8) contrast(1.2) brightness(0.9) grayscale(0.2);
            mix-blend-mode: multiply;
        }

        .scroll-classic { @apply paper-texture text-amber-950 border-8 border-double border-amber-900/40 shadow-2xl; }
        .scroll-noble { @apply bg-slate-50 text-slate-900 border-[12px] border-solid border-yellow-600 shadow-xl; background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png"); }
        .scroll-dark { @apply bg-stone-900 text-stone-300 border-4 border-dashed border-red-900 shadow-2xl; background-image: url("https://www.transparenttextures.com/patterns/black-paper.png"); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- Cabeçalho -->
    <header class="text-center mb-8 border-b-2 border-amber-800/50 pb-6">
        <h1 class="text-4xl md:text-6xl text-amber-500 font-bold mb-2 font-pirata">A Estalagem dos Mercadores</h1>
        <p class="text-lg text-stone-400 font-handwriting italic max-w-2xl mx-auto">
            "As notícias voam nas asas dos corvos e nas carroças dos mercadores."
        </p>
    </header>

    <!-- Tabs -->
    <div class="flex justify-center gap-4 mb-8">
        <button onclick="switchTab('pergaminho')" id="btn-pergaminho" class="px-6 py-3 text-lg font-bold transition-all bg-amber-800 text-amber-100 border-2 border-amber-500 shadow-lg">📜 Contos</button>
        <button onclick="switchTab('procurado')" id="btn-procurado" class="px-6 py-3 text-lg font-bold transition-all bg-stone-800 text-stone-400 border-2 border-stone-700">⚔️ Procurados</button>
    </div>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Formulário -->
        <div class="lg:col-span-5 bg-stone-900 p-6 rounded-lg border border-stone-700 shadow-xl h-fit">
            <div id="form-pergaminho">
                <h2 class="text-2xl text-amber-500 mb-6 font-pirata border-b border-stone-700 pb-2">Mesa do Escriba</h2>
                <div class="space-y-4 font-sans text-sm">
                    <label class="block text-stone-400">Estilo</label>
                    <select onchange="updateScrollStyle(this.value)" class="w-full bg-stone-800 border border-stone-600 p-2 rounded">
                        <option value="classic">Papiro Comum</option>
                        <option value="noble">Decreto Real</option>
                        <option value="dark">Pergaminho Sombrio</option>
                    </select>
                    <label class="block text-stone-400">Título</label>
                    <input type="text" oninput="updateText('scrollTitle', this.value)" placeholder="Título do Conto" class="w-full bg-stone-800 border border-stone-600 p-2 rounded">
                    <label class="block text-stone-400">História</label>
                    <textarea oninput="updateText('scrollText', this.value)" rows="6" class="w-full bg-stone-800 border border-stone-600 p-2 rounded"></textarea>
                    <label class="block text-stone-400">Assinatura</label>
                    <input type="text" oninput="updateText('scrollSignature', this.value)" placeholder="Assinatura" class="w-full bg-stone-800 border border-stone-600 p-2 rounded">
                </div>
            </div>

            <div id="form-procurado" class="hidden">
                <h2 class="text-2xl text-red-500 mb-6 font-pirata border-b border-stone-700 pb-2">Mural do Caçador</h2>
                <div class="space-y-4 font-sans text-sm">
                    <label class="block text-stone-400">Nome do Alvo</label>
                    <input type="text" oninput="updateText('wantedName', this.value)" placeholder="Nome" class="w-full bg-stone-800 border border-stone-600 p-2 rounded">
                    <label class="block text-stone-400">Retrato</label>
                    <input type="file" onchange="loadImage(event)" class="w-full bg-stone-800 border border-stone-600 p-2 rounded">
                    <label class="block text-stone-400">Recompensa</label>
                    <input type="text" oninput="updateText('wantedReward', this.value)" value="5.000 Berrys" class="w-full bg-stone-800 border border-stone-600 p-2 rounded text-amber-500 font-bold">
                    <label class="block text-stone-400">Condição</label>
                    <select onchange="updateText('wantedCondition', this.value)" class="w-full bg-stone-800 border border-stone-600 p-2 rounded">
                        <option value="VIVO OU MORTO">VIVO OU MORTO</option>
                        <option value="APENAS VIVO">APENAS VIVO</option>
                        <option value="APENAS MORTO">APENAS MORTO</option>
                    </select>
                </div>
            </div>

            <button onclick="downloadImage()" class="w-full mt-8 py-4 bg-amber-700 hover:bg-amber-600 text-white font-bold text-xl rounded shadow-lg transition-all">📜 Baixar Imagem</button>
        </div>

        <!-- Preview -->
        <div class="lg:col-span-7 flex justify-center items-start">
            <div id="capture-area" class="w-full max-w-xl p-4">
                
                <!-- Pergaminho Visual -->
                <div id="preview-pergaminho" class="flex flex-col items-center">
                    <div id="scroll-top" class="h-6 bg-[#3e2723] rounded-full border-2 border-[#1b100b] w-[105%] z-20 -mb-3"></div>
                    <div id="scroll-body" class="scroll-classic w-full relative px-10 py-16 z-10 min-h-[400px]">
                        <h1 id="view-scrollTitle" class="text-4xl text-center mb-8 font-pirata border-b-2 border-amber-900/30 pb-4">O Conto de Bravura</h1>
                        <div id="view-scrollText" class="font-handwriting text-2xl leading-relaxed whitespace-pre-wrap">Ouça bem, viajante...</div>
                        <div id="view-scrollSignature" class="mt-16 text-right font-handwriting text-xl font-bold italic pt-4 border-t-2 border-amber-900/20">Ass: Os Mercadores</div>
                    </div>
                    <div id="scroll-bottom" class="h-6 bg-[#3e2723] rounded-full border-2 border-[#1b100b] w-[105%] z-20 -mt-3"></div>
                </div>

                <!-- Cartaz Visual -->
                <div id="preview-procurado" class="hidden wood-texture p-12 flex justify-center">
                    <div class="w-full max-w-sm paper-texture p-8 pb-12 shadow-2xl border border-amber-900/50 relative transform rotate-1">
                        <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-6 bg-stone-400 rounded-full border-2 border-stone-500 z-20"></div>
                        <div class="text-center border-b-4 border-double border-amber-950 pb-2 mb-4">
                            <h1 class="font-wanted text-5xl text-amber-950 uppercase">Procurado</h1>
                            <p id="view-wantedCondition" class="font-medieval text-amber-900 font-bold text-sm">VIVO OU MORTO</p>
                        </div>
                        <div class="w-full aspect-square border-4 border-amber-950 bg-amber-900/20 mb-4 overflow-hidden relative">
                            <img id="view-img" src="" class="w-full h-full object-cover sepia-filter hidden">
                            <div id="view-no-img" class="h-full flex items-center justify-center text-amber-950/40 text-6xl">👤</div>
                        </div>
                        <div class="text-center text-amber-950 font-medieval">
                            <h2 id="view-wantedName" class="text-3xl font-black mb-4 uppercase">Jhon Doe</h2>
                            <p class="text-xs font-bold text-amber-900 uppercase">Recompensa</p>
                            <p id="view-wantedReward" class="text-4xl font-wanted">5.000 Berrys</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let currentTab = 'pergaminho';

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('form-pergaminho').classList.toggle('hidden', tab !== 'pergaminho');
            document.getElementById('form-procurado').classList.toggle('hidden', tab !== 'procurado');
            document.getElementById('preview-pergaminho').classList.toggle('hidden', tab !== 'pergaminho');
            document.getElementById('preview-procurado').classList.toggle('hidden', tab !== 'procurado');
            
            document.getElementById('btn-pergaminho').className = tab === 'pergaminho' ? 'px-6 py-3 text-lg font-bold bg-amber-800 text-amber-100 border-2 border-amber-500 shadow-lg' : 'px-6 py-3 text-lg font-bold bg-stone-800 text-stone-400 border-2 border-stone-700';
            document.getElementById('btn-procurado').className = tab === 'procurado' ? 'px-6 py-3 text-lg font-bold bg-red-900 text-red-100 border-2 border-red-500 shadow-lg' : 'px-6 py-3 text-lg font-bold bg-stone-800 text-stone-400 border-2 border-stone-700';
        }

        function updateText(id, val) {
            document.getElementById('view-' + id).innerText = val;
        }

        function updateScrollStyle(style) {
            const body = document.getElementById('scroll-body');
            body.className = `w-full relative px-10 py-16 z-10 min-h-[400px] scroll-${style}`;
            document.getElementById('scroll-top').style.display = style === 'classic' ? 'block' : 'none';
            document.getElementById('scroll-bottom').style.display = style === 'classic' ? 'block' : 'none';
        }

        function loadImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const img = document.getElementById('view-img');
                img.src = reader.result;
                img.classList.remove('hidden');
                document.getElementById('view-no-img').classList.add('hidden');
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        async function downloadImage() {
            const area = document.getElementById('capture-area');
            const canvas = await html2canvas(area, {
                backgroundColor: currentTab === 'procurado' ? '#2c1e16' : null,
                scale: 2
            });
            const link = document.createElement('a');
            link.download = currentTab + '_mercadores.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        }
    </script>
</body>
</html>
